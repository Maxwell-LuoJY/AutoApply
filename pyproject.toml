[project]
name = "jobagent"
version = "0.1.0"
description = "Standalone internship application agent (fetch, screen, apply)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.64.1",
    "pypdf>=6.21.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
