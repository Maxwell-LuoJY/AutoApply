# Fixed answers to common extra questions. When a run can't answer a required question (the daily report and
# manual_apply.md list it), add a pattern and your answer here, then `uv run jobagent mark <ID> apply` to queue it again.
# 常见附加问题的固定答案。程序答不了的必填题会列在每日报告和 manual_apply.md 里：把关键词和答案加在这里，
# 再运行 `uv run jobagent mark <ID> apply` 重新排队。
#
# match: a regular expression (case-insensitive) / 正则，不区分大小写
# answer: what to pick or type; it can also be an instruction for the form filler / 要选或填的内容，也可以是给 LLM 的说明
#
# Every answer below is an EXAMPLE. Read each one and change what isn't true for you.
# 下面都是示例：逐条核对，不符合你情况的要改。

# ---- general / 通用 ----
- match: "18 years|age of 18|at least 18"
  answer: "Yes"
- match: "relative|family member|related to (an|any) (employee|current)"
  answer: "No"
- match: "^if (yes|so)\\b.*(relative|family|related)|(list|provide) the name.*(relative|family|relationship)"
  answer: "N/A"
- match: "previously (applied|worked|been employed)|former employee|worked (here|for us|at .* before)"
  answer: "No"
- match: "(ever|previously) been employed (with|by)|ever worked (for|at|with)"
  answer: "No"
- match: "non-?compete|restrictive covenant"
  answer: "No"
- match: "currently enrolled|current(ly)? (a )?student|enrolled in a degree"
  answer: "Yes"
- match: "highest (level of )?(education|degree)|degree (are you|currently) pursuing|degree level"
  answer: "Master's degree (M.S. in Computer Science, in progress)"
- match: "graduation (date|month|year)|when (do|will) you graduate|expected graduation"
  answer: "May 2028"
- match: "graduation year|year of graduation|grad(uation)? year|class of"
  answer: "2028"
- match: "major|field of study|discipline"
  answer: "Computer Science"
- match: "start date|when can you start|available to start"
  answer: "May 2027 (Summer 2027)"
- match: "earliest (start|available) date after graduation|start (full[- ]time )?(work )?after graduat|available.*after graduation"
  answer: "June 2028"
- match: "how many months.*(available|availability)|internship (length|duration)|available for .*(weeks|months)"
  answer: "3 months (full-time, Summer 2027)"
- match: "pronoun"
  answer: "Prefer not to say"
- match: "text message|sms|whatsapp"
  answer: "No"
- match: "background check|drug (test|screen)"
  answer: "Yes"
- match: "convicted of|criminal (record|conviction|history)|pled guilty|no contest"
  answer: "No"
- match: "^language$|languages? (you )?(speak|spoken)|native language|language proficiency"
  answer: "English – Fluent"
- match: "phone (device )?type|type of phone"
  answer: "Mobile"
- match: "willing to travel|travel (is )?required|travel as part of"
  answer: "Yes"
- match: "percent.*travel|travel.*percent|percentage of travel|how much (are you willing to )?travel"
  answer: "25%"
- match: "locations? (are )?you (open|willing) to|open to (living|working|relocat)|preferred (work )?locations?"
  answer: "Any — open to all listed locations"
- match: "live within \\d+ miles|within commut|commutable distance|commuting distance|reside in the location"
  answer: "Yes only if the job is in the Ann Arbor, MI area (where the applicant lives); otherwise No"
- match: "driver'?s licen[cs]e|valid licen[cs]e to drive"
  answer: "Yes"
- match: "reliable (form of )?transportation|means of transportation|transportation to (and from )?work"
  answer: "Yes"
- match: "flexible (shifts?|schedules?|hours)"
  answer: "Yes"
- match: "(currently )?have any (other )?offers|competing offers|pending offers|other offers"
  answer: "No"
- match: "candidate'?s company|current (company|employer)|present employer"
  answer: "N/A"
- match: "notice period"
  answer: "N/A"
- match: "coding (assessment|challenge|test)|technical assessment|online assessment|hackerrank|codesignal"
  answer: "Yes"
- match: "salary|compensation|pay (rate|range|expectation)|hourly (rate|pay|wage)|desired (pay|wage)|expected pay"
  answer: "Negotiable"
- match: "posted (salary|pay|hourly).*(align|match|meet)|(salary|pay) range.*(align|expectation)"
  answer: "Yes"
- match: "full[- ]time (role|position|job|opportunit).*(after|following|within)|interested in (a |pursuing )?full[- ]time"
  answer: "Yes"
- match: "(their|referr\\w*|referral'?s?) (name|email)|who referred you|name or email address"
  answer: "N/A"
- match: "meet the (minimum|basic|required) qualifications|meet (all )?the (minimum )?requirements (outlined|listed|of)"
  answer: "Yes"
- match: "conflict of interest|business dealings|(financial|business) interest in (our|the) company"
  answer: "No"
- match: "employed by a (federal|state|local).*government|government (entity|employee|official)|civil service|served in the military"
  answer: "No"
- match: "(immediate )?family member.*government|business partner.*government"
  answer: "No"
- match: "(excluded|debarred|suspended|ineligible).*(health ?care|medicare|medicaid|procurement)"
  answer: "No"
- match: "(able|willing) to provide.*references|provide (2|two|3|three).*references"
  answer: "Yes"
- match: "regular and reliable attendance|attendance is an essential"
  answer: "Yes, I understand and agree"
- match: "if you (selected|answered|chose) .*other.*(specify|explain)"
  answer: "N/A"

# ---- work authorization / 工作授权（按 profile.yaml 的 work_authorization 改）----
# Example for an F-1 student who will need sponsorship later. Change every answer to match your own status.
# 示例是"F-1 学生、将来需要担保"。按你自己的身份逐条改。
- match: "authori[sz]ed to work (under|on) (opt|optional practical training)|(currently )?(on|using) (stem )?opt\\b|optional practical training"
  answer: "Yes"
- match: "(authori[sz]ed|eligible|permitted) to work.*(permanent|indefinite|unrestricted)|(permanent|indefinite|unrestricted).*(work authori|authori[sz]ed to work)"
  answer: "No"
- match: "(now or in the future|future).*sponsor|sponsor.*(now or in the future|future)"
  answer: "Yes"
- match: "(current|present) (us |u\\.s\\. )?(employment |work )?(visa|immigration) (status|type)|visa status"
  answer: "F-1 student; if there is no plain F-1 option, choose F-1 CPT"
- match: "department of homeland security|\\bdhs\\b|employment authorization document|\\bead\\b"
  answer: "Yes"
- match: "export control|itar|ear\\b|u\\.?s\\.? person"
  answer: "Are you a U.S. person under export control rules: No. If the question lists countries and asks whether you are a citizen / permanent resident of one of them: Yes only when India is listed"
- match: "countries listed|following countries|any of (these|the listed) countries|countries below"
  answer: "Yes if India is one of the listed countries (citizen of India), otherwise No"
- match: "country of (legal )?permanent residen|permanent residen(ce|cy) country|which country.*permanent resid"
  answer: "India"
- match: "^please explain$|^explain$|^if yes,? please explain|^please explain your (work )?authorization"
  answer: "If this follows a work-authorization / visa question: 'F-1 student; authorized to work through CPT/OPT.' Otherwise: 'N/A'"
